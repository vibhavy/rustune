<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- rustune app icon. Source of truth: edit here, then run assets/build_icons.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4a1b1a"/>
      <stop offset="0.55" stop-color="#22100f"/>
      <stop offset="1" stop-color="#0d090a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#f0524a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f0524a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7e72"/>
      <stop offset="1" stop-color="#e8443c"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9d4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- macOS-style drop shadow and rounded-square tile -->
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#glow)" clip-path="url(#sq)"/>

  <!-- tick ring, track and coral progress ring (as on the Now Playing screen) -->
  <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="5" stroke-linecap="round">
