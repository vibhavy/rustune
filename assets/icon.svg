1="322.7" y1="251.5" x2="313.3" y2="238.6"/><line x1="351.0" y1="233.1" x2="343.0" y2="219.3"/><line x1="381.0" y1="217.8" x2="374.5" y2="203.2"/><line x1="412.5" y1="205.8" x2="407.6" y2="190.5"/><line x1="445.1" y1="197.0" x2="441.7" y2="181.4"/><line x1="478.3" y1="191.8" x2="476.7" y2="175.9"/><line x1="512.0" y1="190.0" x2="512.0" y2="174.0"/><line x1="545.7" y1="191.8" x2="547.3" y2="175.9"/><line x1="578.9" y1="197.0" x2="582.3" y2="181.4"/><line x1="611.5" y1="205.8" x2="616.4" y2="190.5"/><line x1="643.0" y1="217.8" x2="649.5" y2="203.2"/><line x1="673.0" y1="233.1" x2="681.0" y2="219.3"/><line x1="701.3" y1="251.5" x2="710.7" y2="238.6"/><line x1="727.5" y1="272.7" x2="738.2" y2="260.8"/><line x1="751.3" y1="296.5" x2="763.2" y2="285.8"/><line x1="772.5" y1="322.7" x2="785.4" y2="313.3"/><line x1="790.9" y1="351.0" x2="804.7" y2="343.0"/><line x1="806.2" y1="381.0" x2="820.8" y2="374.5"/><line x1="818.2" y1="412.5" x2="833.5" y2="407.6"/><line x1="827.0" y1="445.1" x2="842.6" y2="441.7"/><line x1="832.2" y1="478.3" x2="848.1" y2="476.7"/>
  </g>
  <circle cx="512" cy="512" r="270" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="30"/>
  <circle cx="512" cy="512" r="270" fill="none" stroke="url(#coral)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="1323.2 1696.5" transform="rotate(-90 512 512)"/>
  <circle cx="246.8" cy="461.4" r="26" fill="#ffffff"/>
  <circle cx="246.8" cy="461.4" r="12" fill="#f0524a"/>

  <!-- waveform (the rustune logo mark) -->
  <g fill="url(#bars)">
    <rect x="321.0" y="452.0" width="34" height="120" rx="17.0"/><rect x="379.0" y="407.0" width="34" height="210" rx="17.0"/><rect x="437.0" y="362.0" width="34" height="300" rx="17.0"/><rect x="495.0" y="322.0" width="34" height="380" rx="17.0"/><rect x="553.0" y="372.0" width="34" height="280" rx="17.0"/><rect x="611.0" y="417.0" width="34" height="190" rx="17.0"/><rect x="669.0" y="457.0" width="34" height="110" rx="17.0"/>
